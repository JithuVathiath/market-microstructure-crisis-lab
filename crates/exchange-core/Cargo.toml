[package]
name = "market-exchange-core"
version = "1.0.0"
edition = "2024"
description = "Deterministic price-time-priority exchange core for Market Microstructure Crisis Lab"
license = "MIT"
repository = "https://github.com/JithuVathiath/market-microstructure-crisis-lab"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
